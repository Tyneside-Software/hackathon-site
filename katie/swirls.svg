<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6f3ff"/>
      <stop offset="22%" stop-color="#89d4ff"/>
      <stop offset="48%" stop-color="#a78bfa"/>
      <stop offset="72%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#ff6bb5"/>
    </linearGradient>
    <radialGradient id="baby" cx="18%" cy="16%" r="58%">
      <stop offset="0%" stop-color="#eaf8ff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mid" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot" cx="84%" cy="86%" r="52%">
      <stop offset="0%" stop-color="#ff4da6" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#ff4da6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff4da6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfefff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#ff4da6"/>
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f4ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#baby)"/>
  <rect width="1600" height="900" fill="url(#mid)"/>
  <rect width="1600" height="900" fill="url(#hot)"/>
  <g filter="url(#soft)">
    <ellipse cx="220" cy="180" rx="320" ry="220" fill="#7dd3fc" opacity="0.55"/>
    <ellipse cx="720" cy="420" rx="260" ry="180" fill="#c4b5fd" opacity="0.42"/>
    <ellipse cx="1320" cy="740" rx="300" ry="200" fill="#ff4da6" opacity="0.5"/>
    <ellipse cx="1080" cy="180" rx="200" ry="140" fill="#a78bfa" opacity="0.35"/>
  </g>
  <g fill="none" stroke="url(#blueRibbon)" stroke-linecap="round" filter="url(#glow)">
    <path d="M-40 160c160-80 280 70 240 190s-220 80-170 200" stroke-width="78" opacity="0.7"/>
    <path d="M80 680c170-40 150-220 320-190s190 180 280 80" stroke-width="70" opacity="0.55"/>
  </g>
  <g fill="none" stroke="url(#ribbon)" stroke-linecap="round" filter="url(#glow)">
    <path d="M180 20c100 140 300 50 340 200s-150 240 50 320 300-30 390 140" stroke-width="88" opacity="0.55"/>
    <path d="M960 -30c50 170 280 90 240 260s-280 130-150 280 320 90 260 250" stroke-width="76" opacity="0.58"/>
    <path d="M680 480c90-160 290-20 270 160s-270 110-200 240" stroke-width="58" opacity="0.62"/>
  </g>
  <g fill="none" stroke="#eaf8ff" stroke-linecap="round" opacity="0.4">
    <path d="M260 240c50-70 160-20 150 55" stroke-width="12"/>
    <path d="M1080 400c60-80 180 10 160 90" stroke-width="14"/>
